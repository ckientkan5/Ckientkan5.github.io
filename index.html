<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bộ mẫu câu tiếng Anh giao tiếp hằng ngày và khẩu lệnh trong trường tiểu học</title>
<style>
:root{
  --blue:#2b6cb0; --blue2:#4299e1; --ink:#243b53; --muted:#64748b;
  --paper:#fffdf8; --line:#dbe7f3; --accent:#f6c85f;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;font-family:"Segoe UI",Arial,sans-serif;background:linear-gradient(135deg,#dbeafe,#fef3c7);color:var(--ink);overflow:hidden}
button{font:inherit}
.app{width:100%;height:100%;display:flex;flex-direction:column}
.toolbar{height:64px;display:flex;align-items:center;justify-content:center;gap:12px;padding:8px 14px;background:rgba(255,255,255,.88);backdrop-filter:blur(10px);box-shadow:0 2px 12px rgba(0,0,0,.12);z-index:20}
.toolbar button,.toolbar select{border:0;border-radius:12px;padding:9px 14px;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.10);cursor:pointer;color:var(--ink)}
.toolbar button:hover{transform:translateY(-1px)}
.counter{min-width:120px;text-align:center;font-weight:700}
.stage{flex:1;display:flex;align-items:center;justify-content:center;padding:18px;perspective:2200px;overflow:hidden}
.book{position:relative;width:min(1180px,94vw);height:min(760px,86vh);transform-style:preserve-3d}
.page{
  position:absolute;inset:0;background:var(--paper);border-radius:8px 14px 14px 8px;
  box-shadow:0 18px 50px rgba(15,23,42,.22), inset 0 0 0 1px rgba(15,23,42,.08);
  padding:34px 42px 50px;overflow:hidden;backface-visibility:hidden;
  transform-origin:left center;transition:transform .72s cubic-bezier(.22,.61,.36,1),z-index 0s linear .35s;
}
.page::before{content:"";position:absolute;inset:0 0 0 0;pointer-events:none;background:linear-gradient(90deg,rgba(0,0,0,.06),transparent 7%,transparent 92%,rgba(0,0,0,.025))}
.page.flipped{transform:rotateY(-180deg);z-index:0}
.page.active{z-index:10}
.cover{background:#fff;color:white;display:flex;align-items:center;justify-content:center;text-align:center;padding:0}
.cover img{width:100%;height:100%;object-fit:cover;display:block;border-radius:8px 14px 14px 8px}
.cover h1{font-size:clamp(28px,4vw,50px);line-height:1.15;margin:0 0 22px;text-shadow:0 3px 10px rgba(0,0,0,.2)}
.cover p{font-size:18px;margin:8px}
.badge{display:inline-block;padding:7px 14px;border-radius:999px;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.5)}
.heading{display:flex;align-items:center;gap:10px;border-bottom:3px solid #bfdbfe;padding-bottom:10px;margin-bottom:14px}
.heading h2{margin:0;color:#1d4ed8;font-size:clamp(18px,2.2vw,28px)}
.icon{font-size:27px}
.table{width:100%;border-collapse:separate;border-spacing:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:clamp(12px,1.25vw,16px)}
.table th{background:#e0f2fe;color:#0f3d6e;padding:9px;text-align:left;position:sticky;top:0}
.table td{padding:7px 9px;border-top:1px solid var(--line);vertical-align:top;line-height:1.35}
.table td:first-child{font-weight:600;width:50%}
.table tr:nth-child(even) td{background:#fff}
.source-line{font-size:14px;line-height:1.35;margin:3px 0}
.footer{position:absolute;bottom:14px;left:42px;right:42px;display:flex;justify-content:space-between;color:#64748b;font-size:12px;border-top:1px solid #e5e7eb;padding-top:7px}
.controls-hint{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);font-size:12px;color:#64748b;z-index:5}
.search{width:min(360px,35vw)}
#toc{max-width:760px;max-height:60vh;overflow:auto;margin:auto}
#toc button{display:block;width:100%;text-align:left;margin:6px 0;padding:10px;border:1px solid var(--line);background:#fff;border-radius:10px;cursor:pointer}
@media(max-width:700px){
 .toolbar{height:58px;gap:6px}.toolbar button,.toolbar select{padding:7px 9px}.search{display:none}
 .stage{padding:8px}.book{height:calc(100vh - 82px);width:96vw}.page{padding:24px 20px 48px}
 .footer{left:20px;right:20px}.table{font-size:11px}
}
</style>
</head>
<body>
<div class="app">
  <div class="toolbar">
    <button id="prev">◀ Trang trước</button>
    <div class="counter" id="counter">1 / 1</div>
    <button id="next">Trang sau ▶</button>
    <button id="tocBtn">☰ Mục lục</button>
    <input id="search" class="search" placeholder="🔎 Tìm trong sách...">
    <button id="fullscreen">⛶</button>
  </div>
  <div class="stage" id="stage">
    <div class="book" id="book"></div>
    <div class="controls-hint">Kéo góc trang / dùng nút ◀ ▶ / phím ← →</div>
  </div>
</div>

const icons = ["👋","🙏","📚","👀","🤫","🧍","✏️","📝","📖","🎧","🗣️","👥","❓","⭐","💡","⏰","🏁","🚶","🔄","⚽","🧼","🍱","😴","🌱","🛡️","🤝","🇬🇧"];
const major = /^(I|II|III)\.\s/;
const section = /^\d+\.\s+/;

function esc(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

function isHeader(s){
  return major.test(s) || section.test(s) || s === "English Tiếng Việt" || s === "English                    Tiếng Việt";
}
function isEnglish(s){
  // Most English entries contain Latin words and punctuation; Vietnamese translations
  // usually include Vietnamese diacritics. This heuristic is only for visual pairing.
  return !/[ăâđêôơưáàảãạấầẩẫậắằẳẵặéèẻẽẹếềểễệíìỉĩịóòỏõọốồổỗộớờởỡợúùủũụứừửữựýỳỷỹỵ]/i.test(s);
}
function headingIcon(s){
  let idx = 0;
  if(major.test(s)) idx = s.startsWith("II.")?2:s.startsWith("III.")?3:0;
  else if(section.test(s)){ idx = (parseInt(s)||1) % icons.length; }
  return icons[idx];
}

function buildContentLines(lines){
  const out=[];
  for(let i=0;i<lines.length;i++){
    const s=lines[i];
    if(isHeader(s)) out.push({type:"heading", text:s});
    else out.push({type:"line", text:s});
  }
  return out;
}

// Build logical content chunks. We deliberately keep EVERY extracted non-empty line.
// Tables are visualized by pairing adjacent English/Vietnamese lines where possible,
// while any unpaired lines remain visible as source lines.
const logical=[];
for(const pg of SOURCE){
  logical.push({type:"sourcePage", page:pg.page, lines:buildContentLines(pg.lines)});
}

// Flatten into chunks of manageable size while never dropping source lines.
const pages=[];
pages.push({cover:true});
let currentRows=[], currentTitle="";
function flush(){
  if(currentRows.length) pages.push({title:currentTitle||"Nội dung", rows:currentRows}), currentRows=[];
}
for(const block of logical){
  let pendingEnglish=null;
  for(const item of block.lines){
    if(item.type==="heading"){
      if(pendingEnglish){currentRows.push({en:pendingEnglish,vi:""});pendingEnglish=null;}
      if(currentRows.length && (major.test(item.text) || section.test(item.text))){
        // Keep section heading at the top of a new visual page when possible.
        if(currentRows.length>8) flush();
      }
      currentTitle=item.text;
      currentRows.push({heading:item.text});
    }else{
      if(!pendingEnglish){
        pendingEnglish=item.text;
      }else{
        currentRows.push({en:pendingEnglish,vi:item.text});
        pendingEnglish=null;
      }
      if(currentRows.length>=14) flush();
    }
  }
  if(pendingEnglish){currentRows.push({en:pendingEnglish,vi:""});}
}
flush();

const book=document.getElementById("book");
function makePage(p,idx){
  const el=document.createElement("section");
  el.className="page"+(idx===0?" active":"");
  el.dataset.index=idx;
  if(p.cover){
    el.classList.add("cover");
    el.innerHTML=`<img src="https://i.ibb.co/GvJSkhHY/Gemini-Generated-Image-pytdfypytdfypytd-1.png" alt="Trang bìa">`;
  }else{
    let title=p.title||"Nội dung";
    let rows="";
    for(const r of p.rows){
      if(r.heading){
        rows+=`<tr><td colspan="2" style="background:#eff6ff;color:#1d4ed8;font-weight:800;font-size:1.08em;padding-top:10px;padding-bottom:10px">${headingIcon(r.heading)} ${esc(r.heading)}</td></tr>`;
      }else{
        rows+=`<tr><td>${esc(r.en)}</td><td>${esc(r.vi)}</td></tr>`;
      }
    }
    el.innerHTML=`<div class="heading"><span class="icon">${headingIcon(title)}</span><h2>${esc(title)}</h2></div>
      <table class="table"><thead><tr><th>🇬🇧 English</th><th>🇻🇳 Tiếng Việt</th></tr></thead><tbody>${rows}</tbody></table>`;
  }
  el.insertAdjacentHTML("beforeend",`<div class="footer"><span>Ckientkan5</span><span>Trang ${idx+1}</span></div>`);
  return el;
}
pages.forEach((p,i)=>book.appendChild(makePage(p,i)));

let current=0;
const pageEls=[...document.querySelectorAll(".page")];
function render(){
  pageEls.forEach((p,i)=>{
    p.classList.toggle("flipped",i<current);
    p.classList.toggle("active",i===current);
    p.style.zIndex=(i<current?i:pages.length-i);
  });
  document.getElementById("counter").textContent=`${current+1} / ${pages.length}`;
}
function go(n){current=Math.max(0,Math.min(pages.length-1,n));render();}
document.getElementById("prev").onclick=()=>go(current-1);
document.getElementById("next").onclick=()=>go(current+1);
document.addEventListener("keydown",e=>{
  if(e.key==="ArrowLeft")go(current-1);
  if(e.key==="ArrowRight" || e.key===" ") { if(e.key===" ") e.preventDefault(); go(current+1); }
});
let drag=false,startX=0;
book.addEventListener("pointerdown",e=>{drag=true;startX=e.clientX;book.setPointerCapture(e.pointerId)});
book.addEventListener("pointerup",e=>{
  if(!drag)return;drag=false;const dx=e.clientX-startX;
  if(Math.abs(dx)>45) go(current+(dx<0?1:-1));
});
document.getElementById("fullscreen").onclick=()=>{
  const el=document.documentElement;
  if(!document.fullscreenElement) el.requestFullscreen?.(); else document.exitFullscreen?.();
};
document.getElementById("tocBtn").onclick=()=>{
  const choices=pages.map((p,i)=>({p,i})).filter(x=>x.p.title);
  const box=document.createElement("div");
  box.className="page active";
  box.style.zIndex=999;
  box.innerHTML=`<div class="heading"><span class="icon">☰</span><h2>Mục lục</h2></div><div id="toc"></div>`;
  const toc=box.querySelector("#toc");
  choices.forEach(({p,i})=>{
    const b=document.createElement("button");
    b.textContent=`${headingIcon(p.title)} ${p.title}`;
    b.onclick=()=>{box.remove();go(i)};
    toc.appendChild(b);
  });
  const close=document.createElement("button");close.textContent="Đóng ✕";close.onclick=()=>box.remove();
  toc.appendChild(close);book.appendChild(box);
};
document.getElementById("search").addEventListener("input",e=>{
  const q=e.target.value.trim().toLowerCase();
  if(!q)return;
  const idx=pages.findIndex(p=>!p.cover && JSON.stringify(p).toLowerCase().includes(q));
  if(idx>=0)go(idx);
});
render();
